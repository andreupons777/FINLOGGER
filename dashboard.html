<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinLogger - Dashboard</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- External Stylesheet -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="finlogger-header py-3">
    <div class="container-lg">
      <div class="row align-items-center">
        <div class="col-md-6">
          <span class="brand-name">FinLogger</span>
        </div>
        <div class="col-md-6 text-md-end">
          <span class="brand-tagline tagline">Your financial diary!</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-lg main-container my-4">
    <!-- Row 1: OVERVIEW + Month Filter + Add Expense Button -->
    <div class="row align-items-center mb-4 overview-top-row">
      <div class="col-md-6">
        <h2 class="overview-title mb-0">OVERVIEW</h2>
      </div>
      <div class="col-md-6">
        <div class="d-flex justify-content-md-end align-items-center gap-2 flex-wrap">
          <input type="month" id="monthFilter" class="form-control month-input" value="2020-01" />
          <button type="button" class="btn btn-primary expButton add-expense-btn" data-mode="add">
            Add Expense
          </button>
        </div>
      </div>
    </div>

    <!-- Row 2: Three Overview Cards -->
    <div class="row g-3 mb-4 overview-cards-row">
      <div class="col-md-4">
        <div class="card overview-card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <img src="./images/spending.png" alt="Expenses" class="overview-icon" />
              </div>
              <div>
                <p class="card-text mb-1">Expenses</p>
                <h5 class="card-title mb-0" id="totalExpenses"></h5>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card overview-card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <img src="./images/income.png" alt="Monthly Income" class="overview-icon" />
              </div>
              <div>
                <p class="card-text mb-1">Monthly Income</p>
                <h5 class="card-title mb-0" id="income"></h5>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card overview-card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <div class="me-3">
                <img src="./images/balance.png" alt="Balance" class="overview-icon" />
              </div>
              <div>
                <p class="card-text mb-1">Balance</p>
                <h5 class="card-title mb-0" id="balance"></h5>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Row 3: Expense Summary (4 cols) & Expense Details (8 cols) -->
    <div class="row g-4 tbl-container">
      <div class="col-md-4">
        <h3 class="section-heading mb-3">Expense Summary</h3>
        <div class="table-responsive">
          <table id="expense-summary" class="table border">
            <thead>
              <tr>
                <th>EXPENSE CATEGORY</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="col-md-8">
        <h3 class="section-heading mb-3">Expense Details</h3>
        <div class="table-responsive">
          <table id="expenseTable" class="table border">
            <thead>
              <tr>
                <th>DATE</th>
                <th>DESCRIPTION</th>
                <th>AMOUNT</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Expense Entry / Edit Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="expenseForm">
          <div class="modal-body">
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" class="form-control" id="date" />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select class="form-control" id="category">
                <option value="">--Select Category--</option>
              </select>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <input type="text" class="form-control" id="description" placeholder="Enter description" />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" class="form-control" id="amount" placeholder="Enter amount" />
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="expense-submit-btn">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this expense?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary delete-confirm-btn" id="confirm-delete-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3.3 Bundle JS & jQuery 3.7.1 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <!-- Application Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
